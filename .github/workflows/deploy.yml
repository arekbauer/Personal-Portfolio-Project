name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Validate Django Project
        env:
          DJANGO_SETTINGS_MODULE: "Personal_Portfolio.test_settings"
          SECRET_KEY: "django-dummy-key"
          SPOTIFY_CLIENT_ID: "test-client-id"
          SPOTIFY_CLIENT_SECRET: "test-client-secret"
          SPOTIFY_REFRESH_TOKEN: "test-refresh-token"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput

      - name: Run Django Tests
        env:
          DJANGO_SETTINGS_MODULE: "Personal_Portfolio.test_settings"
          SECRET_KEY: "django-dummy-key"
          SPOTIFY_CLIENT_ID: "test-client-id"
          SPOTIFY_CLIENT_SECRET: "test-client-secret"
          SPOTIFY_REFRESH_TOKEN: "test-refresh-token"
        run: python manage.py test --verbosity 2

      - name: Run JavaScript Tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PA_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.PA_HOST }}
          SSH_USERNAME: ${{ secrets.PA_USERNAME }}
          WORKING_DIRECTORY: ${{ secrets.PA_WORKING_DIRECTORY }}
          VENV_DIRECTORY: ${{ secrets.PA_VENV_DIRECTORY }}
          WSGI_FILE: ${{ secrets.PA_WSGI_PATH }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USERNAME@$SSH_HOST" \
            bash -s -- "$WORKING_DIRECTORY" "$VENV_DIRECTORY" "$WSGI_FILE" <<'DEPLOY'
          set -euo pipefail

          working_directory="$1"
          venv_directory="$2"
          wsgi_file="$3"

          cd "$working_directory"
          git fetch origin main
          git merge --ff-only origin/main

          source "$venv_directory/bin/activate"
          python -m pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          touch "$wsgi_file"
          DEPLOY
